<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Editor — Upload Weekly Quotes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Upload Weekly Quotes</h1>
  <p class="sub">Upload each week's recipe JSONs here — translators visiting
    the main app automatically see the current/upcoming week's quotes, no
    upload needed on their end.</p>

  <div class="card field-group">
    <label>Password</label>
    <input type="password" id="password" autocomplete="off">
  </div>

  <div class="card field-group" style="margin-top:16px;">
    <label>Week starting (Monday)</label>
    <input type="date" id="weekStart">

    <label class="dropzone" id="dropzone" style="margin-top:12px;">
      <input type="file" id="fileInput" accept="application/json,.json" multiple>
      Drop this week's <strong>.json</strong> recipe files here, or click to choose
    </label>
    <div id="selectedFiles"></div>

    <label class="dropzone" id="jpgDropzone" style="margin-top:12px;">
      <input type="file" id="jpgFileInput" accept="image/jpeg,.jpg,.jpeg" multiple>
      Optional: drop the matching exported <strong>.jpg</strong> files here (same
      name as the JSONs, e.g. "Sep 21.jpg") &mdash; if given, the email uses this
      image directly instead of re-rendering it
    </label>
    <div id="selectedJpgs"></div>

    <div style="margin-top:16px;">
      <label>Youtube Link</label>
      <label class="sub" style="display:flex; align-items:center; gap:6px; margin:6px 0;">
        <input type="checkbox" id="sameLinkAllDays" checked>
        Use the same link for all 5 days
      </label>
      <div id="unchangeLinks"></div>
    </div>

    <div style="margin-top:16px;">
      <label>Recipient emails (for the weekly digest BCC)</label>
      <textarea id="recipients" rows="4" style="width:100%; font-family:inherit;"
        placeholder="Name &lt;email@example.com&gt;, Name &lt;email@example.com&gt;, ..."></textarea>
    </div>

    <button class="btn btn-blue" id="uploadBtn" style="margin-top:12px;">Upload week</button>
    <div id="uploadMsg" class="admin-msg"></div>
  </div>

  <div class="card field-group" style="margin-top:16px;">
    <h2>Currently stored weeks</h2>
    <div id="storedList" class="stored-list"></div>
  </div>
</div>

<script src="weekdates.js"></script>
<script src="data.js"></script>
</body>
</html>
